project_root: "."
data_dir: "."
output_dir: "group assignment"
paths:
  cv_dir: "CV"
  gt_dir: "JD + Hired CV"
  xlsx: "Manatal Examples – JD & CV (anonymised).xlsx"
  plan_pdf: "AI_CV_Matching_Project_Plan.pdf"
ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen3.5:4b"
  fallback_model: "qwen3.8:27b"
  timeout: 300
  fallback_timeout: 600
  temperature: 0
  seed: 42
  num_ctx: 8192
  num_predict: 2000
  top_p: 1.0
  think: false
  workers: 1
seed: 42
extraction:
  chunk_threshold: 8000
  chunk_size: 4000
  chunk_overlap: 200
clustering:
  distance_threshold: 0.35
  min_clusters: 100
  max_clusters: 200
  embedding_method: "auto"  # sentence-transformers | char_tfidf_svd | rapidfuzz
autoencoder:
  latent_dim: 32
  hidden_dims: [256, 64]
  dropout: 0.2
  denoising: false
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 16
  max_epochs: 500
  patience: 40
  grad_clip: 1.0
  svd_reduce_threshold: 400
  svd_components: 300
retrieval:
  top_k: 10
  hybrid_alpha: 0.8
  metadata_weight: 0.3
